<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        .sidebar-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 250px;
            height: 100vh;
            background: rgba(27, 42, 30, 0.95);
            backdrop-filter: blur(10px);
            padding: 30px 20px;
            color: white;
            z-index: 1000;
            overflow-y: auto;
            transition: all 0.3s;
        }

        .sidebar-nav .logo {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-nav .logo h2 {
            font-size: 24px;
            font-weight: 800;
            color: white;
        }

        .sidebar-nav .logo h2 span {
            color: #4CAF50;
        }

        .sidebar-nav .logo p {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 5px;
        }

        .sidebar-nav .nav-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar-nav .nav-list li {
            margin-bottom: 5px;
        }

        .sidebar-nav .nav-list li a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 10px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .sidebar-nav .nav-list li a:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .sidebar-nav .nav-list li a.active {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
        }

        .sidebar-nav .nav-list li a i {
            width: 20px;
            text-align: center;
            font-size: 16px;
        }

        .sidebar-nav .nav-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 15px 0;
        }

        .sidebar-nav .user-info {
            padding: 15px 16px;
            margin-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-nav .user-info .user-name {
            font-weight: 600;
            color: white;
            font-size: 14px;
        }

        .sidebar-nav .user-info .user-email {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        .sidebar-nav .logout-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 10px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .sidebar-nav .logout-btn:hover {
            background: rgba(255, 0, 0, 0.1);
            color: #ff6b6b;
        }

        @media (max-width: 768px) {
            .sidebar-nav {
                transform: translateX(-100%);
                width: 280px;
            }
            .sidebar-nav.open {
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>
    <div class="sidebar-nav" id="sidebarNav">
        <div class="logo">
            <h2>📦 <span>PantryPulse</span></h2>
            <p>Smart Pantry Management</p>
        </div>

        <ul class="nav-list">
            <li><a href="{{ url_for('welcome') }}" class="{% if request.endpoint == 'welcome' %}active{% endif %}">
                <i class="fa-solid fa-gauge-high"></i> Dashboard
            </a></li>
            <li><a href="{{ url_for('pantry') }}" class="{% if request.endpoint == 'pantry' %}active{% endif %}">
                <i class="fa-solid fa-boxes-stacked"></i> Pantry List
            </a></li>
            <li><a href="{{ url_for('purchase') }}" class="{% if request.endpoint == 'purchase' %}active{% endif %}">
                <i class="fa-solid fa-receipt"></i> Purchases
            </a></li>
            <li><a href="{{ url_for('recipes') }}" class="{% if request.endpoint == 'recipes' %}active{% endif %}">
                <i class="fa-solid fa-utensils"></i> Recipes
            </a></li>
            <li><a href="{{ url_for('analytics') }}" class="{% if request.endpoint == 'analytics' %}active{% endif %}">
                <i class="fa-solid fa-chart-pie"></i> Analytics
            </a></li>
            <li><a href="{{ url_for('expiry_alerts') }}" class="{% if request.endpoint == 'expiry_alerts' %}active{% endif %}">
                <i class="fa-solid fa-bell"></i> Expiry Alerts
            </a></li>
            <li><a href="{{ url_for('feedback') }}" class="{% if request.endpoint == 'feedback' %}active{% endif %}">
                <i class="fa-solid fa-comment"></i> Feedback
            </a></li>
        </ul>

        <div class="nav-divider"></div>

        <ul class="nav-list">
            <li><a href="{{ url_for('profile') }}" class="{% if request.endpoint == 'profile' %}active{% endif %}">
                <i class="fa-solid fa-user"></i> Profile
            </a></li>
            <li><a href="{{ url_for('contact') }}" class="{% if request.endpoint == 'contact' %}active{% endif %}">
                <i class="fa-solid fa-envelope"></i> Contact
            </a></li>
        </ul>

        <div class="user-info">
            <div class="user-name">👤 {{ session.get('fullname', 'User') }}</div>
            <div class="user-email">{{ session.get('email', '') }}</div>
        </div>

        <a href="{{ url_for('logout') }}" class="logout-btn">
            <i class="fa-solid fa-right-from-bracket"></i> Logout
        </a>
    </div>

    <!-- Mobile Hamburger Menu -->
    <button id="menuToggle" style="display:none; position:fixed; top:15px; left:15px; z-index:1001; background:#2E7D32; color:white; border:none; border-radius:8px; padding:12px 16px; font-size:18px; cursor:pointer;">
        <i class="fa-solid fa-bars"></i>
    </button>

    <script>
        // Mobile menu toggle
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebarNav');

        if (window.innerWidth <= 768) {
            menuToggle.style.display = 'block';
        }

        menuToggle?.addEventListener('click', function() {
            sidebar.classList.toggle('open');
        });

        // Close sidebar when clicking outside on mobile
        document.addEventListener('click', function(e) {
            if (window.innerWidth <= 768) {
                if (!sidebar.contains(e.target) && e.target !== menuToggle) {
                    sidebar.classList.remove('open');
                }
            }
        });
    </script>

</body>
</html>
